    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#6366f1', 600: '#4f46e5' },
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    animation: {
                        'spin-slow': 'spin 12s linear infinite',
                        'pulse-glow': 'pulse-glow 3s infinite',
                        'scan': 'scan 4s linear infinite',
                    },
                    keyframes: {
                        'pulse-glow': {
                            '0%, 100%': { opacity: 0.6, filter: 'drop-shadow(0 0 5px rgba(99, 102, 241, 0.5))' },
                            '50%': { opacity: 1, filter: 'drop-shadow(0 0 15px rgba(99, 102, 241, 0.8))' },
                        },
                        'scan': {
                            '0%': { transform: 'translateY(-100%)', opacity: 0 },
                            '50%': { opacity: 1 },
                            '100%': { transform: 'translateY(100%)', opacity: 0 },
                        }
                    }
                }

    <style>
        /* CSS Variables */
        :root {
            --bg-body: #f8fafc;
            --bg-sidebar: #ffffff;
            --bg-card: #ffffff;
            --border-color: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --hover-bg: #f1f5f9;
            --accent-color: #6366f1;
            --checkbox-border: #cbd5e1;
            --checkbox-checked: #10b981;
        }

        .dark {
            --bg-body: #050505;
            --bg-sidebar: #0a0a0a;
            --bg-card: #121212;
            --border-color: #27272a;
            --text-primary: #e4e4e7;
            --text-secondary: #a1a1aa;
            --hover-bg: #1c1c1c;
            --accent-color: #818cf8;
            --checkbox-border: #52525b;
            --checkbox-checked: #10b981;
        }

        body { 
            background-color: var(--bg-body); 
            color: var(--text-primary); 
            transition: background-color 0.3s, color 0.3s;
        }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--text-secondary); border-radius: 3px; opacity: 0.2; }
        
        .accordion-content {
            transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
            max-height: 0; opacity: 0; overflow: hidden;
        }
        .accordion-content.open { max-height: 5000px; opacity: 1; }

        .custom-checkbox {
            appearance: none; width: 1.25rem; height: 1.25rem;
            border: 2px solid var(--checkbox-border); border-radius: 6px;
            background-color: transparent; cursor: pointer; position: relative;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; align-items: center; justify-content: center;
        }
        .custom-checkbox:checked {
            background-color: var(--checkbox-checked); border-color: var(--checkbox-checked);
            background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3e%3cpath d='M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z'/%3e%3c/svg%3e");
            background-size: 100% 100%; transform: scale(1.05);
        }

        .task-card {
            background-color: var(--bg-card); border: 1px solid var(--border-color);
            transition: all 0.2s; border-left: 3px solid transparent;
        }
        .task-card:hover {
            transform: translateX(2px); border-color: var(--accent-color);
            border-left-color: var(--accent-color); background-color: var(--hover-bg);
        }
        .task-card.checked { border-left-color: var(--checkbox-checked); opacity: 0.7; background-color: var(--hover-bg); }

        .tool-badge {
            font-size: 0.65rem; padding: 2px 8px; border-radius: 9999px;
            background: rgba(99, 102, 241, 0.1); border: 1px solid rgba(99, 102, 241, 0.2);
            color: var(--accent-color); font-family: 'JetBrains Mono', monospace;
        }
        
        .owasp-badge {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.1), rgba(245, 158, 11, 0.2));
            border: 1px solid rgba(251, 191, 36, 0.3); color: #fbbf24;
        }
        .light .owasp-badge { color: #d97706; border-color: #d97706; background: rgba(251, 191, 36, 0.1); }

        .sidebar-item:hover { background-color: var(--hover-bg); color: var(--text-primary); }
        .sidebar-item.active-domain { background-color: var(--hover-bg); color: var(--text-primary); }

        /* Mobile Sidebar Transitions */
        .mobile-sidebar-overlay {
            transition: opacity 0.3s ease;
            opacity: 0; pointer-events: none;
        }
        .mobile-sidebar-overlay.active { opacity: 1; pointer-events: auto; }
        
        .sidebar-panel {
            transition: transform 0.3s ease-in-out;
            transform: translateX(-100%);
        }
        .sidebar-panel.active { transform: translateX(0); }

        /* Typing Effect Cursor */
        .typing-cursor::after {
            content: '|'; animation: blink 1s step-end infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>

        // --- TOOL HELPER ---
        function getSmartTools(taskName) {
            const t = taskName.toLowerCase();
            const tools = [];
            
            if(t.includes('sql')) tools.push('SQLMap', 'Burp');
            if(t.includes('xss')) tools.push('Dalfox', 'XSStrike');
            if(t.includes('subdomain')) tools.push('Subfinder', 'Amass');
            if(t.includes('directory') || t.includes('fuzz')) tools.push('FFuF', 'Dirsearch');
            if(t.includes('jwt')) tools.push('JWT_Tool');
            if(t.includes('git')) tools.push('TruffleHog');
            if(t.includes('s3') || t.includes('bucket')) tools.push('AWS CLI', 'CloudSploit');
            if(t.includes('ssrf')) tools.push('SSRFmap', 'Burp Collab');
            if(t.includes('graphql')) tools.push('InQL', 'GraphQL Voyager');
            if(t.includes('android') || t.includes('apk')) tools.push('Jadx', 'Frida');
            if(t.includes('ios') || t.includes('plist')) tools.push('Objection', 'MobSF');
            if(t.includes('port') || t.includes('nmap')) tools.push('Nmap');
            if(t.includes('burp')) tools.push('Burp Suite');
            if(t.includes('idor')) tools.push('Authorize (Burp)');
            if(t.includes('api')) tools.push('Postman', 'Kiterunner');
            
            if(tools.length === 0) tools.push('Manual Review', 'Burp Suite');
            
            return [...new Set(tools)].slice(0, 3);
        }

        // --- APP LOGIC ---
        const app = {
            state: {},
            theme: 'light', // Default to Light
            activeDomainIdx: null,
            activeCategoryIdx: null,

            init() {
                try {
                    const saved = localStorage.getItem('vapt_state_v6');
                    if(saved) this.state = JSON.parse(saved);
                    
                    const savedTheme = localStorage.getItem('vapt_theme');
                    if(savedTheme) this.theme = savedTheme;
                    this.applyTheme();

                    this.renderSidebar();
                    this.updateGlobalProgress();
                    this.startTypingEffect();
                } catch(e) {
                    console.error("Init Error", e);
                }
            },

            getKey(dIdx, cIdx, tIdx) {
                return `${dIdx}_${cIdx}_${tIdx}`;
            },
            
            toggleTheme() {
                this.theme = this.theme === 'dark' ? 'light' : 'dark';
                localStorage.setItem('vapt_theme', this.theme);
                this.applyTheme();
            },

            applyTheme() {
                if(this.theme === 'dark') {
                    document.documentElement.classList.add('dark');
                    document.documentElement.classList.remove('light');
                } else {
                    document.documentElement.classList.add('light');
                    document.documentElement.classList.remove('dark');
                }
            },

            toggleMobileSidebar() {
                const sidebar = document.getElementById('sidebar');
                const overlay = document.getElementById('mobile-overlay');
                
                if (sidebar.classList.contains('active')) {
                    sidebar.classList.remove('active');
                    overlay.classList.remove('active');
                } else {
                    sidebar.classList.add('active');
                    overlay.classList.add('active');
                }
            },

            renderSidebar() {
                const container = document.getElementById('sidebar-container');
                const searchVal = document.getElementById('search-input').value.toLowerCase();
                container.innerHTML = '';

                vaptData.forEach((domain, dIdx) => {
                    const matchesSearch = !searchVal || 
                        domain.title.toLowerCase().includes(searchVal) || 
                        domain.categories.some(c => c.title.toLowerCase().includes(searchVal));
                    
                    if(!matchesSearch) return;

                    const isOpen = this.state[`open_${dIdx}`] || !!searchVal;

                    const domainEl = document.createElement('div');
                    domainEl.className = 'mb-1';
                    
                    domainEl.innerHTML = `
                        <div onclick="app.toggleDomain(${dIdx})" 
                             class="sidebar-item flex items-center justify-between px-3 py-2.5 rounded-lg cursor-pointer transition-colors ${isOpen ? 'active-domain' : ''} select-none group">
                            <div class="flex items-center gap-3">
                                <div class="w-5 text-center opacity-70 group-hover:opacity-100 group-hover:text-indigo-500 transition-colors"><i class="fa-solid ${domain.icon}"></i></div>
                                <span class="text-xs font-semibold uppercase tracking-wide">${domain.title}</span>
                            </div>
                            <i class="fa-solid fa-chevron-right text-[10px] transition-transform duration-300 ${isOpen ? 'rotate-90' : ''}"></i>
                        </div>
                        <div class="accordion-content ${isOpen ? 'open' : ''}">
                            <div class="pl-9 pr-2 py-1 space-y-0.5 mt-1" id="cat-container-${dIdx}"></div>
                        </div>
                    `;

                    const catContainer = domainEl.querySelector(`#cat-container-${dIdx}`);
                    
                    domain.categories.forEach((cat, cIdx) => {
                        if(searchVal && !cat.title.toLowerCase().includes(searchVal) && !domain.title.toLowerCase().includes(searchVal)) return;

                        const total = cat.tasks.length;
                        let done = 0;
                        cat.tasks.forEach((_, tIdx) => {
                            if(this.state[this.getKey(dIdx, cIdx, tIdx)]) done++;
                        });

                        const isActive = this.activeDomainIdx === dIdx && this.activeCategoryIdx === cIdx;
                        
                        const baseClass = cat.isOwasp 
                            ? (isActive ? 'owasp-badge border-l-2' : 'owasp-badge opacity-70 hover:opacity-100 border-l-2 border-transparent') 
                            : (isActive ? 'bg-[var(--hover-bg)] text-[var(--text-primary)] border-l-2 border-indigo-500' : 'text-[var(--text-secondary)] hover:bg-[var(--hover-bg)] hover:text-[var(--text-primary)] border-l-2 border-transparent');

                        const catEl = document.createElement('div');
                        catEl.className = `${baseClass} text-xs px-3 py-2 rounded-r-md cursor-pointer flex justify-between items-center select-none transition-all`;
                        catEl.onclick = (e) => { e.stopPropagation(); this.loadCategory(dIdx, cIdx); };
                        
                        catEl.innerHTML = `
                            <span class="truncate pr-2 font-medium">${cat.title}</span>
                            ${done > 0 && done === total ? '<i class="fa-solid fa-check text-emerald-500"></i>' : ''}
                        `;
                        catContainer.appendChild(catEl);
                    });

                    container.appendChild(domainEl);
                });
            },

            loadCategory(dIdx, cIdx) {
                this.activeDomainIdx = dIdx;
                this.activeCategoryIdx = cIdx;
                
                // Auto Close mobile sidebar on selection
                if(window.innerWidth < 768) {
                    this.toggleMobileSidebar();
                }

                const domain = vaptData[dIdx];
                const category = domain.categories[cIdx];
                
                document.getElementById('header-domain').innerText = domain.title.toUpperCase();
                const titleEl = document.getElementById('header-title');
                titleEl.innerText = category.title;
                
                if(category.isOwasp) {
                    titleEl.className = "text-xl md:text-2xl font-bold text-amber-500 tracking-tight drop-shadow-sm";
                } else {
                    titleEl.className = "text-xl md:text-2xl font-bold text-[var(--text-primary)] tracking-tight";
                }

                const list = document.getElementById('tasks-list');
                list.innerHTML = '';

                let doneCount = 0;
                
                category.tasks.forEach((task, tIdx) => {
                    const key = this.getKey(dIdx, cIdx, tIdx);
                    const isChecked = !!this.state[key];
                    if(isChecked) doneCount++;
                    
                    const tools = getSmartTools(task);

                    const taskEl = document.createElement('div');
                    taskEl.className = `task-card rounded-xl p-4 mb-3 flex items-start gap-4 cursor-pointer select-none ${isChecked ? 'checked' : ''}`;
                    taskEl.onclick = (e) => {
                        if(e.target.type !== 'checkbox') this.toggleTask(dIdx, cIdx, tIdx);
                    };

                    taskEl.innerHTML = `
                        <div class="pt-0.5 shrink-0">
                            <input type="checkbox" class="custom-checkbox" 
                                   ${isChecked ? 'checked' : ''} 
                                   onchange="app.toggleTask(${dIdx}, ${cIdx}, ${tIdx})">
                        </div>
                        <div class="flex-1">
                            <div class="text-sm font-medium ${isChecked ? 'line-through text-[var(--text-secondary)]' : 'text-[var(--text-primary)]'}">
                                ${task}
                            </div>
                            <div class="mt-2 flex flex-wrap gap-1.5">
                                ${tools.map(t => `<span class="tool-badge"><i class="fa-solid fa-wrench text-[0.6rem]"></i> ${t}</span>`).join('')}
                            </div>
                        </div>
                    `;
                    list.appendChild(taskEl);
                });

                document.getElementById('category-stats').innerHTML = `${doneCount}<span class="text-[var(--text-secondary)] text-xl">/${category.tasks.length}</span>`;
                this.renderSidebar(); 
            },

            toggleDomain(dIdx) {
                // Exclusive Accordion Logic: Close others
                vaptData.forEach((_, idx) => {
                    if(idx !== dIdx) this.state[`open_${idx}`] = false;
                });

                this.state[`open_${dIdx}`] = !this.state[`open_${dIdx}`];
                this.save();
                this.renderSidebar();
            },

            toggleTask(dIdx, cIdx, tIdx) {
                const key = this.getKey(dIdx, cIdx, tIdx);
                if(this.state[key]) delete this.state[key];
                else this.state[key] = true;
                
                this.save();
                if(this.activeDomainIdx === dIdx && this.activeCategoryIdx === cIdx) {
                    this.loadCategory(dIdx, cIdx);
                }
                this.updateGlobalProgress();
            },

            updateGlobalProgress() {
                let total = 0, completed = 0;
                vaptData.forEach((d, dIdx) => {
                    d.categories.forEach((c, cIdx) => {
                        c.tasks.forEach((_, tIdx) => {
                            total++;
                            if(this.state[this.getKey(dIdx, cIdx, tIdx)]) completed++;
                        });
                    });
                });

                const pct = total === 0 ? 0 : Math.round((completed / total) * 100);
                document.getElementById('global-percent').innerText = `${pct}%`;
                document.getElementById('global-progress-bar').style.width = `${pct}%`;
                
                if(pct === 100 && total > 0) {
                    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                }
            },

            startTypingEffect() {
                const text = "System initialized. Select a domain to begin scanning protocols...";
                const el = document.getElementById('typing-text');
                if(!el) return;
                let i = 0;
                const interval = setInterval(() => {
                    el.innerText += text.charAt(i);
                    i++;
                    if(i >= text.length) clearInterval(interval);
                }, 50);
            },

            save() {
                localStorage.setItem('vapt_state_v6', JSON.stringify(this.state));
            },

            resetData() {
                if(confirm("Are you sure you want to clear all progress?")) {
                    this.state = {};
                    this.save();
                    location.reload(); // Hard reload to reset UI to default state
                }
            }
        };

        // Search Listener
        document.getElementById('search-input').addEventListener('input', () => app.renderSidebar());

        // Start
        app.init();
    </script>
</body>
</html>
